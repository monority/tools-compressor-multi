[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compressor-multi"
version = "0.1.0"
description = "Multi-format file compressor with dynamic quality presets"
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.9.0",
    "puremagic>=1.20",
    "pymupdf>=1.23.0",
    "Pillow>=10.0.0",
    "pillow-avif-plugin>=1.4.0",
    "zstandard>=0.22.0",
    "py7zr>=0.21.0",
    "python-docx>=1.0.0",
    "openpyxl>=3.1.0",
    "PyYAML>=6.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
compress = "compressor.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/compressor"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
